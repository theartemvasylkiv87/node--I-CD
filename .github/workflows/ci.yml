name: Node.js CI

on: 
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install dependencies
    run: npm ci

  - name: build project
    run: npm run build

  - name: run unit tests
    run: npm test
